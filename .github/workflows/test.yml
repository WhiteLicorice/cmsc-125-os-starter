# SPDX-License-Identifier: MIT
#
# The public test workflow.
#
# Fork this repository once, at the start of Lab 1, and keep your fork. Each
# laboratory raises STAGE by one. Nothing is merged into the fork after the
# first clone, so the stage you set is the only thing that decides which cases
# run. Set STAGE to the highest stage you have implemented. The workflow runs
# the same command as the local gate. Each job is red until that stage passes,
# which is the correct starting state. A lab at stage N never fails on a case
# from a stage above N.
#
# The Ubuntu job and the macOS job grade the same commit, so both jobs stay red
# until the stage passes.
#
# The macOS job runs the -mac targets. Apple's clang has no 32-bit RISC-V
# target, so the -mac targets select Homebrew's clang and PATH.

name: test

on:
  push:
  pull_request:

env:
  # Lab 1. Raise this to 2, 3, and 4 as each laboratory begins.
  STAGE: 1

jobs:
  test:
    strategy:
      # Keep both jobs running. A red Ubuntu job must not hide the macOS result.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld qemu-system-misc

      - name: Install the toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm lld qemu

      - name: Print the selected stage
        run: echo "STAGE=$STAGE"

      - name: Run the stage tests (Ubuntu)
        if: runner.os == 'Linux'
        run: make test STAGE=$STAGE

      - name: Run the stage tests (macOS)
        if: runner.os == 'macOS'
        run: make test-mac STAGE=$STAGE
